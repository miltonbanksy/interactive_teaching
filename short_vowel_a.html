<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Vowel a</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 id="display-cap-type"></h1>
    <button id="btn-rnd-cap">Random Cap!</button>
    <img class="img-thumbs" id="img-cap">

    <button id="btn-rnd-vowelA">Short Vowel a</button>
    <img class="img-thumbs" id="img-vowelA">

    <button id="btn-rnd-vowelI">Short Vowel i</button>
    <img class="img-thumbs", id="img-vowelI">

    <button id="btn-rnd-vowelI_b">Short Vowel i b</button>
    <img class="img-thumbs", id="img-vowelI_b">
    
    <script>
        const objCaps = [
            {"sentence": "A blue cap", "image": "cap_blue.png", "color": "#006400"},
            {"sentence": "A green cap", "image": "cap_green.png", "color": "green"},
            {"sentence": "An orange cap", "image": "cap_orange.png", "color": "green"},
            {"sentence": "A pink cap", "image": "cap_pink.png"},
            {"sentence": "A red cap", "image": "cap_red.png"},
            {"sentence": "A white cap", "image": "cap_white.png"},
            {"sentence": "A yellow cap", "image": "cap_yellow.png"}
        ];

        const array_a = [
            "apple_green.jpg",
            "baby.webp",
            "cap.jpg",
            "cat.jfif",
            "cat2.jpg",
            "chair.jfif",
            "dam.jpg",
            "dog.jfif",
            "jam.jpg",
            "map.jpg",
            "map2.jpg",
            "mouse.jfif",
            "panda.avif",
            "panda2.jfif",
            "table.jpg",
            "tap.jpg"
        ];

        const array_i_b = [
            "bib1.JFIF",
            "bib2.JFIF",
            "bib3.JFIF",
            "book1.JFIF",
            "book2.JFIF",
            "book3.JFIF",
            "dig1.JFIF",
            "dig2.JFIF",
            "dig3.JFIF",
            "fin1.JFIF",
            "fin2.JFIF",
            "fin3.PNG",
            "gorilla1.JFIF",
            "gorilla2.JFIF",
            "gorilla3.JFIF",
            "igloo1.JFIF",
            "igloo2.JFIF",
            "igloo3.JFIF",
            "lid1.JFIF",
            "lid2.JFIF",
            "lid3.JFIF",
            "nut1.JFIF",
            "nut2.JFIF",
            "nut3.JFIF",
            "pin1.JFIF",
            "pin2.PNG",
            "pin3.PNG",
            "rib1.JFIF",
            "rib2.JFIF",
            "rib3.JFIF",
            "wig1.JFIF",
            "wig2.JFIF",
            "wig3.JFIF"
        ];

        const btnRndVowelI_b = document.querySelector('#btn-rnd-vowelI_b');
        const displayImgVowelI_b = document.querySelector('#img-vowelI_b');

        btnRndVowelI_b.addEventListener('click', () => {
            const index = Math.floor(Math.random() * array_i_b.length);
            const img = array_i_b[index];
            displayImgVowelI_b.src = img;
        });

        const btnRndCap = document.querySelector("#btn-rnd-cap");
        const imgCap = document.querySelector("#img-cap");
        const displayCapType = document.querySelector('#display-cap-type');
        const redCap = "";

        btnRndCap.addEventListener('click', () => {
            displayCapType.innerHTML = "";
            const rndCapIndex = Math.floor(Math.random() * objCaps.length);
            rndCap = objCaps[rndCapIndex];
            imgCap.src = rndCap.image;
            
        });

        imgCap.addEventListener('click', () => {
            displayCapType.innerHTML = rndCap.sentence;
        })

        const btnRndVowelA = document.querySelector('#btn-rnd-vowelA');
        const imgVowelA = document.querySelector('#img-vowelA');

        btnRndVowelA.addEventListener('click', () => {
            const imgVowelAIndex = Math.floor(Math.random() * array_a.length);
            imgVowelA.src = array_a[imgVowelAIndex];
        })
    </script>
</body>
</html>
